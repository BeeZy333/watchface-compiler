name: Build Watchface

on: [push]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find and Compile
        shell: powershell
        run: |
          # Автоматически ищем любой zip-файл в корне репозитория
          $zipFile = Get-ChildItem -Path . -Filter *.zip | Select-Object -First 1
          if (-not $zipFile) {
            Write-Host "No zip file found, skipping build."
            exit 0
          }
          Write-Host "Found archive: $($zipFile.Name)"
          
          # Распаковываем найденный архив
          Expand-Archive -Path $zipFile.FullName -DestinationPath .\source -Force
          
          # Компилируем
          .\compile.exe .\source
          
          # Ищем готовый .bin файл
          $binFile = Get-ChildItem -Path . -Filter *.bin -Recurse | Select-Object -First 1
          if (-not $binFile) {
            Write-Error "Compilation failed, no .bin file found!"
            exit 1
          }
          Copy-Item -Path $binFile.FullName -Destination .\result.bin
          Write-Host "Done! Prepared result.bin"

      - uses: actions/upload-artifact@v4
        with:
          name: watchface-bin
          path: result.bin
